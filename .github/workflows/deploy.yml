name: Deploy to Yandex Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Библиотеки из requirements.txt Яндекс-облако ставит само при сборке версии,
      # поэтому больше не упаковываем их руками: прежний архив весил 51 МБ и не проходил.
      # В функцию едут только два файла — код и список библиотек.
      - name: Deploy to Yandex Cloud
        uses: yc-actions/yc-sls-function@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: banner-generator-api
          runtime: python312
          entrypoint: handler.handler
          memory: 1024Mb
          execution-timeout: 180
          bucket: banner-storage-pilot
          include: |
            handler.py
            requirements.txt
          environment: |
            STORAGE_ACCESS_KEY=${{ secrets.STORAGE_ACCESS_KEY }}
            STORAGE_SECRET_KEY=${{ secrets.STORAGE_SECRET_KEY }}
            BUCKET_NAME=${{ secrets.BUCKET_NAME }}
            FOLDER_ID=${{ secrets.FOLDER_ID }}
            API_KEY=${{ secrets.API_KEY }}
